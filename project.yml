name: EnglishReader

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

options:
  bundleIdPrefix: com.ray
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  EnglishReader:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ZIPFoundation
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 书声
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: 用于跟读练习和口语对话录音
        NSSpeechRecognitionUsageDescription: 用于把你的口语转成文字并评分
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDocumentTypes:
          - CFBundleTypeName: 电子书
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.data
              - public.content
              - public.text
              - public.plain-text
              - org.idpf.epub-container
              - com.amazon.mobi
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB 电子书
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
              public.mime-type:
                - application/epub+zip
          - UTTypeIdentifier: com.amazon.mobi
            UTTypeDescription: MOBI 电子书
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mobi
                - prc
              public.mime-type:
                - application/x-mobipocket-ebook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ray.englishreader
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
